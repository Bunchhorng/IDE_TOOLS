# Response compression
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    application/manifest+json
    text/css
    text/plain
    text/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;

    # Prevent Nginx from appending internal ports to 301 redirects
    port_in_redirect off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend REST API (php-fpm via FastCGI on backend:9000)
    location /api/ {
        set $php_backend backend:9000;
        include fastcgi_params;
        fastcgi_pass $php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        # Forward HTTPS scheme state from Caddy to Laravel
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTPS $http_x_forwarded_proto;

        client_max_body_size 10m;
    }

    # Vite/PWA static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|webmanifest|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # SPA frontend fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
    }
}
