server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend REST API (php-fpm via FastCGI on backend:9000)
    # Resolved at request time via Docker DNS so a backend recreate does
    # not leave nginx pointing at a stale container IP.
    location /api/ {
        set $php_backend backend:9000;
        include fastcgi_params;
        fastcgi_pass $php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        client_max_body_size 10m;
    }

    # Vite/PWA assets (fingerprinted, immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|webmanifest|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # Frontend app routes (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
    }
}