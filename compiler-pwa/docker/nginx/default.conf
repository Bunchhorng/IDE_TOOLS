# Response compression: JSON API payloads (poll responses carry base64
# terminal streams) and static assets shrink 3-5x, cutting mobile bandwidth
# and latency for a whole classroom.
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    application/manifest+json
    text/css
    text/plain
    text/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;

    # Security headers (applied to all responses; add_header inheritance
    # means server-level directives are inherited by locations that do not
    # define their own add_header — the cache blocks below do, so the
    # headers are repeated there).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend REST API (php-fpm via FastCGI on backend:9000)
    # Resolved at request time via Docker DNS so a backend recreate does
    # not leave nginx pointing at a stale container IP.
    location /api/ {
        set $php_backend backend:9000;
        include fastcgi_params;
        fastcgi_pass $php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        client_max_body_size 10m;
    }

    # Vite/PWA assets (fingerprinted, immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|webmanifest|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # Frontend app routes (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
    }
}

# HTTPS (for local LAN/dev testing, mkcert trusted CA)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/coderunner.pem;
    ssl_certificate_key /etc/nginx/certs/coderunner-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /var/www/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $php_backend backend:9000;
        include fastcgi_params;
        fastcgi_pass $php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        client_max_body_size 10m;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|webmanifest|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
    }
}