; PHP-FPM pool tuning for many concurrent students.
; Mounted read-only over the stock pool config by docker-compose.
;
; Sizing rule: pm.max_children <= available_ram_for_fpm / avg_request_memory.
; A typical API request (auth + query + serialize) peaks at ~30-40MB,
; so 12 children need roughly 400-500MB — safe next to sandbox containers.
; With the default worker count (4 sandboxes) the API is never the
; bottleneck: one Monaco save + a few polls per student is tiny traffic.

[www]
user = www-data
group = www-data

listen = 9000

; dynamic pool: grow under load, shrink when idle (memory-friendly).
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Hard wall against runaway requests (file saves are small; polling is fast).
pm.max_requests = 500

; Fail fast rather than piling up: nginx returns 502 quickly when the pool
; is saturated, and the frontend retries polling — better than a 60s hang.
; listen.backlog is handled by the OS; request_terminate_timeout is the
; safety net for a wedged request.
;
; 90s (not 65s): an interactive session start may legitimately spend up to
; 60s waiting on a slow docker daemon to ACCEPT `docker run -d`, then up to
; 20s on the ready/rc handshake. 65s would kill that request mid-flight and
; re-surface the very "Failed to start interactive session" symptom this
; window was designed to eliminate. Interactive starts are rare (one per
; run) and finish in ~1s normally, so the larger cap costs nothing.
request_terminate_timeout = 90s

; Slow-request log for spotting N+1s / slow queries in class time.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 3s

; Log to stderr so `docker logs` shows everything (12-factor style).
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
catch_workers_output = yes
decorate_workers_output = no
