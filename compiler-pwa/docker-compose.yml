services:
  mysql:
    image: mysql:8.0
    container_name: coderunner-mysql
    restart: unless-stopped
    # Cap the DB itself so a runaway query/load cannot starve the host that
    # also runs sandbox containers. 512MB is enough for this schema.
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-compiler}
      MYSQL_USER: ${DB_USERNAME:-compiler}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - coderunner-net

  redis:
    image: redis:7-alpine
    container_name: coderunner-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coderunner-net

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: coderunner/backend:latest
    container_name: coderunner-backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_KEY=${APP_KEY:-base64:95ObMnk6oNIcFxdv/ft1Nh+zAlhcLu3uX3d3BlGiMvI=}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-compiler}
      - DB_USERNAME=${DB_USERNAME:-compiler}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - EXECUTION_TIMEOUT=${EXECUTION_TIMEOUT:-5}
      - EXECUTION_MEMORY_LIMIT=${EXECUTION_MEMORY_LIMIT:-134217728}
      - EXECUTION_OUTPUT_LIMIT=${EXECUTION_OUTPUT_LIMIT:-1000000}
      - EXECUTION_RATE_PER_MINUTE=${EXECUTION_RATE_PER_MINUTE:-5}
      - EXECUTION_RATE_PER_HOUR=${EXECUTION_RATE_PER_HOUR:-50}
      - EXECUTION_HOST_BASE=${EXECUTION_HOST_BASE}
    volumes:
      - ./backend:/var/www/html
      - ./docker/backend/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./docker/backend/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # php-fpm workers run as www-data; give them the host docker group gid so
    # interactive sessions can talk to the docker socket (default matches the
    # usual docker group; override with DOCKER_GROUP_ID=<gid>).
    group_add:
      - "${DOCKER_GROUP_ID:-984}"
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # php-fpm is a FastCGI server — never expose it beyond localhost; nginx
      # reaches it over the internal docker network.
      - "127.0.0.1:9000:9000"
    networks:
      coderunner-net:
        ipv4_address: 172.20.0.10

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: coderunner/backend:latest
    container_name: coderunner-worker
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_KEY=${APP_KEY:-base64:95ObMnk6oNIcFxdv/ft1Nh+zAlhcLu3uX3d3BlGiMvI=}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-compiler}
      - DB_USERNAME=${DB_USERNAME:-compiler}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - EXECUTION_TIMEOUT=${EXECUTION_TIMEOUT:-5}
      - EXECUTION_MEMORY_LIMIT=${EXECUTION_MEMORY_LIMIT:-134217728}
      - EXECUTION_OUTPUT_LIMIT=${EXECUTION_OUTPUT_LIMIT:-1000000}
      - EXECUTION_HOST_BASE=${EXECUTION_HOST_BASE}
      # How many parallel queue workers (=> parallel sandbox containers).
      # Size as: CPU cores x 0.75 for compile-heavy classrooms.
      - WORKER_PROCS=${WORKER_PROCS:-4}
    volumes:
      - ./backend:/var/www/html
      - ./backend:${EXECUTION_HOST_BASE}
      - /var/run/docker.sock:/var/run/docker.sock
    # N parallel queue:work processes; each processes one job (= one docker
    # sandbox) at a time. --max-jobs forces periodic restarts (memory leak
    # hygiene). Job timeout 90s > sandbox 5s wall clock + compile + headroom.
    command: sh -c "for i in $$(seq 1 $${WORKER_PROCS:-4}); do php artisan queue:work --sleep=1 --tries=1 --timeout=90 --max-jobs=200 & done; wait"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coderunner-net

  frontend:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: coderunner-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - coderunner-net

  nginx:
    image: nginx:alpine
    container_name: coderunner-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/var/www/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - coderunner-net

  # Database admin UI — localhost only. Login with DB_USERNAME/DB_PASSWORD
  # (default compiler/secret) or root/${DB_ROOT_PASSWORD:-rootsecret}.
  phpmyadmin:
    profiles: ["dev"]
    image: phpmyadmin:latest
    container_name: coderunner-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - coderunner-net

volumes:
  mysql_data:
  redis_data:

networks:
  coderunner-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16


